
name: Build Android APKs

on:
  push:
    branches:
      - android-fixes-v6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
            min-sdk: 28
          - abi: armeabi-v7a
            triplet: arm-neon-android
            min-sdk: 26

    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_HOST_TRIPLET: x64-linux
      ANDROID_ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned vcpkg
        run: |
          if [ -d vcpkg/.git ]; then
            git -C vcpkg fetch --all --tags --prune
            git -C vcpkg checkout 5f96cd15fd745122cf27e0524606d6c1efc5fd07
            git -C vcpkg fetch --unshallow origin || true
          else
            git clone https://github.com/microsoft/vcpkg.git
            git -C vcpkg checkout 5f96cd15fd745122cf27e0524606d6c1efc5fd07
          fi

      - name: Verify vcpkg baseline
        run: |
          BASELINE="d5ec528843d29e3a52d745a64b469f810b2cedbf"

          if ! git -C vcpkg cat-file -e "$BASELINE^{commit}" 2>/dev/null; then
            git -C vcpkg fetch origin "$BASELINE" || true
          fi

          if ! git -C vcpkg cat-file -e "$BASELINE^{commit}" 2>/dev/null; then
            echo "::error::The vcpkg baseline commit is unavailable."
            exit 1
          fi

          git -C vcpkg show "$BASELINE:versions/baseline.json" >/dev/null

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install dependencies
        run: |
          ./vcpkg/vcpkg install \
            --triplet "${{ matrix.triplet }}" \
            --host-triplet x64-linux

      - name: Download game assets
        run: |
          mkdir -p android/app/src/main/assets/game

          curl -fL \
            "https://github.com/KartKrewDev/RingRacers/releases/download/v2.4/Dr.Robotnik.s-Ring-Racers-v2.4-Assets.zip" \
            -o ring-racers-assets.zip

          mkdir -p assets-temp
          unzip -q ring-racers-assets.zip -d assets-temp

          find assets-temp -type f \( -name "*.pk3" -o -name "gamecontrollerdb.txt" \) \
            -exec cp {} android/app/src/main/assets/game/ \;

          test -f android/app/src/main/assets/game/bios.pk3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --console=plain \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingRacers-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
